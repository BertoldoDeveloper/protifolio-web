<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Portfólio profissional de Ladislau Bertoldo, estudante de Engenharia de Software e desenvolvedor em início de carreira."
    />
    <meta name="theme-color" content="#EAE8E3" />

    <script>
      try {
        const savedTheme = localStorage.getItem("portfolio-theme");

        const theme = savedTheme === "dark" ? "dark" : "light";

        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Ladislau Bertoldo | Desenvolvedor de Software</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
